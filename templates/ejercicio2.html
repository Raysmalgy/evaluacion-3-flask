{% extends 'base.html' %}

{% block title %}Ejercicio 2 - Comparar Nombres{% endblock %}

{% block content %}
<div class="container centrado">
    <form method="POST">
        <div class="form-group">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" value="{{ nombre1 if nombre1 is defined else '' }}" required>
        </div>
        <div class="form-group">
            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" value="{{ nombre2 if nombre2 is defined else '' }}" required>
        </div>
        <div class="form-group">
            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" value="{{ nombre3 if nombre3 is defined else '' }}" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Enviar">
        </div>
    </form>

    {% if mayor is defined and cantidad is defined %}
    <div class="resultado">
        <p>El nombre con mayor cantidad de caracteres es : {{ mayor }}</p>
        <p>El nombre tiene : {{ cantidad }} caracteres</p>
    </div>
    {% endif %}
</div>
{% endblock %}
